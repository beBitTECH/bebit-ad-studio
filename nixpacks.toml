[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_18", "libnss3", "libatk1_0", "libatk-bridge2_0", "libcups2", "libgbm", "libasound2", "pango", "libxss", "gtk3", "libxshmfence", "libGLU", "chromium"]

[phases.install]
cmds = [
  "pip install -r requirements.txt --break-system-packages",
  "npm ci"
]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT"
