<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#0A0F1E;font-family:'Noto Sans TC',sans-serif;}
.g1{position:absolute;width:760px;height:760px;background:radial-gradient(circle,#1E3A5F50,transparent 65%);top:-240px;right:-160px;}
.g2{position:absolute;width:440px;height:440px;background:radial-gradient(circle,#60A5FA14,transparent 65%);bottom:-80px;left:-60px;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;display:flex;flex-direction:column;z-index:5;}
.top{display:flex;justify-content:space-between;align-items:center;padding:50px 68px 0;flex-shrink:0;height:180px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;filter:brightness(0) invert(1);}
.tag{background:#132040;border:1px solid rgba(96,165,250,0.2);color:#60A5FA;font-family:'Syne',sans-serif;font-size:21px;font-weight:700;padding:10px 28px;border-radius:40px;}
.body{flex:1;padding:28px 68px 0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.eye{color:#60A5FA;font-family:'Syne',sans-serif;font-size:21px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.eye::before{content:'';width:44px;height:3px;background:#60A5FA;}
.hl{font-family:'Syne',sans-serif;color:#FFFFFF;font-size:92px;font-weight:800;line-height:1.06;letter-spacing:-.04em;margin-bottom:16px;}
.sub{color:#93C5FD;font-size:38px;line-height:1.5;}
.bar{flex-shrink:0;height:230px;background:#0F1A30;border-top:2px solid #60A5FA40;padding:0 68px;display:flex;align-items:center;justify-content:space-between;}
.spk{display:flex;align-items:center;gap:22px;}
.sp{width:200px;height:200px;border-radius:50%;overflow:hidden;border:3px solid #60A5FA65;flex-shrink:0;}
.sp img{width:200px;height:200px;object-fit:cover;object-position:top center;}
.spkn{color:#FFFFFF;font-family:'Syne',sans-serif;font-size:38px;font-weight:700;}
.spkr{color:#93C5FD;font-size:28px;margin-top:5px;}
.rb{display:flex;flex-direction:column;align-items:flex-end;gap:12px;}
.mr{color:#93C5FD;font-size:26px;}
.cta{background:#1E3A5F;color:#FFFFFF;font-family:'Syne',sans-serif;font-size:26px;font-weight:700;padding:14px 48px;border-radius:50px;border:1px solid #60A5FA60;}
</style></head><body>
<div class="g1"></div><div class="g2"></div><svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="hx" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse"><polygon points="30,2 58,17 58,47 30,62 2,47 2,17" fill="none" stroke="#60A5FA" stroke-width="0.7" opacity="0.15"/></pattern></defs><rect width="1080" height="1080" fill="url(#hx)"/><circle cx="1040" cy="40" r="90" fill="none" stroke="#60A5FA" stroke-width="1.2" opacity="0.18"/><circle cx="40" cy="1040" r="70" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.15"/><line x1="0" y1="180" x2="280" y2="180" stroke="#60A5FA" stroke-width="1.2" opacity="0.22"/><line x1="800" y1="900" x2="1080" y2="900" stroke="#60A5FA" stroke-width="1.2" opacity="0.22"/></svg>
<div class="wrap">
  <div class="top"><div class="logo"><img src="darklogo.png"></div><div class="tag">AI × CDP × 電商</div></div>
  <div class="body"><div class="eye">2025 座談會</div><div class="hl">數據變現加速器</div><div class="sub">掌握AI力量，精準個人化行銷。</div></div>
  <div class="bar">
    <div class="spk"><div class="sp"><img src="speaker4.jpg"></div><div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div></div>
    <div class="rb"><div class="mr">2025.04.20（四） 14:00–15:20</div><div class="mr">台北 W 飯店 皇家宴會廳</div><div class="cta">立即報名 →</div></div>
  </div>
</div></body></html>
