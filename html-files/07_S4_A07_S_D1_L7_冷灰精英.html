<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#F4F6F8;font-family:'Noto Sans TC',sans-serif;}
.g1{position:absolute;width:760px;height:760px;background:radial-gradient(circle,#0F2D5250,transparent 65%);top:-240px;right:-160px;}
.g2{position:absolute;width:440px;height:440px;background:radial-gradient(circle,#1D6FA414,transparent 65%);bottom:-80px;left:-60px;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;display:flex;flex-direction:column;z-index:5;}
.top{display:flex;justify-content:space-between;align-items:center;padding:50px 68px 0;flex-shrink:0;height:180px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;filter:brightness(0) invert(1);}
.tag{background:#E8F0F8;border:1px solid #D1DCE8;color:#1D6FA4;font-family:'Syne',sans-serif;font-size:21px;font-weight:700;padding:10px 28px;border-radius:40px;}
.body{flex:1;padding:28px 68px 0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.eye{color:#1D6FA4;font-family:'Syne',sans-serif;font-size:21px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.eye::before{content:'';width:44px;height:3px;background:#1D6FA4;}
.hl{font-family:'Syne',sans-serif;color:#0F172A;font-size:92px;font-weight:800;line-height:1.06;letter-spacing:-.04em;margin-bottom:16px;}
.sub{color:#334155;font-size:38px;line-height:1.5;}
.bar{flex-shrink:0;height:230px;background:#FFFFFF;border-top:2px solid #1D6FA440;padding:0 68px;display:flex;align-items:center;justify-content:space-between;}
.spk{display:flex;align-items:center;gap:22px;}
.sp{width:200px;height:200px;border-radius:50%;overflow:hidden;border:3px solid #1D6FA465;flex-shrink:0;}
.sp img{width:200px;height:200px;object-fit:cover;object-position:top center;}
.spkn{color:#0F172A;font-family:'Syne',sans-serif;font-size:38px;font-weight:700;}
.spkr{color:#334155;font-size:28px;margin-top:5px;}
.rb{display:flex;flex-direction:column;align-items:flex-end;gap:12px;}
.mr{color:#334155;font-size:26px;}
.cta{background:#0F2D52;color:#FFFFFF;font-family:'Syne',sans-serif;font-size:26px;font-weight:700;padding:14px 48px;border-radius:50px;border:1px solid #1D6FA460;}
</style></head><body>
<div class="g1"></div><div class="g2"></div><svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dt" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="1.2" fill="#1D6FA4" opacity="0.18"/></pattern></defs><rect width="1080" height="1080" fill="url(#dt)"/><path d="M0,90 H180 V270 H380 V180 H560" stroke="#1D6FA4" stroke-width="1.4" fill="none" opacity="0.2"/><path d="M1080,810 H900 V630 H700 V720 H500 V920" stroke="#1D6FA4" stroke-width="1.4" fill="none" opacity="0.2"/><circle cx="180" cy="90" r="5" fill="#1D6FA4" opacity="0.35"/><circle cx="380" cy="270" r="5" fill="#1D6FA4" opacity="0.35"/><circle cx="900" cy="810" r="5" fill="#1D6FA4" opacity="0.35"/><circle cx="700" cy="630" r="5" fill="#1D6FA4" opacity="0.35"/></svg>
<div class="wrap">
  <div class="top"><div class="logo"><img src="logo.png"></div><div class="tag">AI × CDP × 電商</div></div>

  <div class="bar">
    <div class="spk"><div class="sp"><img src="speaker4.jpg"></div><div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div></div>
    <div class="rb"><div class="mr">2025.04.20（四） 14:00–15:20</div><div class="mr">台北 W 飯店 皇家宴會廳</div><div class="cta">搶先揭曉 →</div></div>
  </div>
