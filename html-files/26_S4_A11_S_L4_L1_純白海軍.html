<style>
*{margin:0;padding:0;box-sizing:border-box;}

.sp img{width:180px;height:180px;object-fit:cover;object-position:top center;}
.spkn{color:#0A0A0A;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;text-align:center;}
.spkr{color:#4A5568;font-family:'Outfit',sans-serif;font-size:18px;text-align:center;line-height:1.4;}
.foot{flex-shrink:0;display:flex;justify-content:flex-end;margin-top:24px;}
.cta{background:#003366;color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;padding:14px 52px;border-radius:4px;}
