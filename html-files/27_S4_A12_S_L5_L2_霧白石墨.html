<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#F9FAFB;font-family:'Noto Sans TC',sans-serif;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;display:flex;flex-direction:column;}
.upper{flex:1;padding:52px 68px 32px;display:flex;flex-direction:column;overflow:hidden;}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;margin-bottom:36px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;}
.tag{background:#F3F4F6;border:1px solid #E5E7EB;color:#374151;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;padding:9px 24px;border-radius:20px;}
.mid{flex:1;display:flex;gap:44px;align-items:center;overflow:hidden;}
.txt{flex:1;overflow:hidden;}
.cat{color:#374151;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;}
.hl{font-family:'Outfit',sans-serif;color:#111827;font-size:80px;font-weight:800;line-height:1.07;letter-spacing:-.04em;margin-bottom:18px;}
.sub{color:#6B7280;font-family:'Outfit',sans-serif;font-size:36px;font-weight:400;line-height:1.5;}
.spk-card{width:240px;flex-shrink:0;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.sp{width:160px;height:160px;border-radius:50%;overflow:hidden;border:2px solid #E5E7EB;}
.sp img{width:160px;height:160px;object-fit:cover;object-position:top center;}
.spkn{color:#111827;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;text-align:center;}
.spkr{color:#6B7280;font-family:'Outfit',sans-serif;font-size:18px;text-align:center;line-height:1.4;}
.lower{flex-shrink:0;height:190px;background:#111827;display:flex;align-items:center;justify-content:space-between;padding:0 68px;}
.meta{display:flex;flex-direction:column;gap:10px;}
.mr{color:rgba(255,255,255,0.75);font-size:26px;display:flex;align-items:center;gap:10px;}.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.6);}
.cta{background:#FFFFFF;color:#111827;font-family:'Outfit',sans-serif;font-size:24px;font-weight:800;padding:16px 52px;border-radius:50px;white-space:nowrap;}
</style></head><body>
<svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dt" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="1.2" fill="#374151" opacity="0.18"/></pattern></defs><rect width="1080" height="1080" fill="url(#dt)"/><path d="M0,90 H180 V270 H380 V180 H560" stroke="#374151" stroke-width="1.4" fill="none" opacity="0.2"/><path d="M1080,810 H900 V630 H700 V720 H500 V920" stroke="#374151" stroke-width="1.4" fill="none" opacity="0.2"/><circle cx="180" cy="90" r="5" fill="#374151" opacity="0.35"/><circle cx="380" cy="270" r="5" fill="#374151" opacity="0.35"/><circle cx="900" cy="810" r="5" fill="#374151" opacity="0.35"/><circle cx="700" cy="630" r="5" fill="#374151" opacity="0.35"/></svg>
<div class="wrap">
  <div class="upper">
    <div class="hdr"><div class="logo"><img src="logo.png"></div><div class="tag">AI × CDP × 電商</div></div>
    <div class="mid">
      <div class="txt"><div class="cat">2025 座談會</div><div class="hl">倒數計時，速報！</div><div class="sub">AI CDP 3.0，改變電商格局。</div></div>
      <div class="spk-card"><div class="sp"><img src="speaker4.jpg"></div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div>
    </div>
  </div>
  <div class="lower">
    <div class="meta"><div class="mr"><div class="dot"></div>2025.04.20（四） 14:00–15:20</div><div class="mr"><div class="dot"></div>台北 W 飯店 皇家宴會廳</div></div>
    <div class="cta">立即報名 →</div>
  </div>
</div></body></html>
