<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#071A10;font-family:'Noto Sans TC',sans-serif;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;padding:52px 56px;display:flex;flex-direction:column;}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;margin-bottom:32px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;}
.badge{background:#0D2E1C;border:1px solid rgba(52,211,153,0.2);color:#34D399;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;padding:9px 24px;border-radius:20px;}
.cols{display:grid;grid-template-columns:1fr 1px 220px 1px 1fr;flex:1;overflow:hidden;}
.sep{background:rgba(52,211,153,0.2);}
.col{padding:0 36px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}
.col:first-child{padding-left:0;}
.col:last-child{padding-right:0;}
.cl{color:#34D399;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;}
.hl{font-family:'Outfit',sans-serif;color:#FFFFFF;font-size:66px;font-weight:800;line-height:1.09;letter-spacing:-.035em;}
.sub{color:#6EE7B7;font-size:30px;line-height:1.55;margin-top:16px;}
.mid-col{padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.sp{width:180px;height:180px;border-radius:50%;overflow:hidden;border:2px solid rgba(52,211,153,0.2);}
.sp img{width:180px;height:180px;object-fit:cover;object-position:top center;}
.spkn{color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;text-align:center;}
.spkr{color:#6EE7B7;font-size:18px;text-align:center;line-height:1.4;}
.info-list{display:flex;flex-direction:column;gap:14px;}
.ii{border-left:3px solid #34D399;padding-left:14px;}
.il{color:#34D399;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.iv{color:#FFFFFF;font-size:22px;font-weight:600;line-height:1.35;}
.cta{background:#065F46;color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;padding:14px 0;border-radius:6px;text-align:center;}
</style></head><body>
<svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dt" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="1.2" fill="#34D399" opacity="0.18"/></pattern></defs><rect width="1080" height="1080" fill="url(#dt)"/><path d="M0,90 H180 V270 H380 V180 H560" stroke="#34D399" stroke-width="1.4" fill="none" opacity="0.2"/><path d="M1080,810 H900 V630 H700 V720 H500 V920" stroke="#34D399" stroke-width="1.4" fill="none" opacity="0.2"/><circle cx="180" cy="90" r="5" fill="#34D399" opacity="0.35"/><circle cx="380" cy="270" r="5" fill="#34D399" opacity="0.35"/><circle cx="900" cy="810" r="5" fill="#34D399" opacity="0.35"/><circle cx="700" cy="630" r="5" fill="#34D399" opacity="0.35"/></svg>
<div class="wrap">
  <div class="hdr"><div class="logo"><img src="darklogo.png"></div><div class="badge">AI × CDP × 電商</div></div>
  <div class="cols">
    <div class="col">
      <div><div class="cl">本次主題</div><div class="hl">倒數計時，速報！</div><div class="sub">AI CDP 3.0，改變電商格局。</div></div>
    </div>
    <div class="sep"></div>
    <div class="col">
      <div class="cl" style="text-align:center">主講者</div>
      <div class="mid-col"><div class="sp"><img src="speaker4.jpg"></div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div>
      <div></div>
    </div>
    <div class="sep"></div>
    <div class="col">
      <div>
        <div class="cl">活動資訊</div>
        <div class="info-list">
          <div class="ii"><div class="il">日期</div><div class="iv">2025.04.20（四）</div></div>
          <div class="ii"><div class="il">時間</div><div class="iv">14:00–15:20</div></div>
          <div class="ii"><div class="il">地點</div><div class="iv">台北 W 飯店 皇家宴會廳</div></div>
        </div>
      </div>
      <div class="cta">立即報名 →</div>
    </div>
  </div>
</div></body></html>
