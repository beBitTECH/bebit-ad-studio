<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#FFFDF7;font-family:'Noto Sans TC',sans-serif;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;display:flex;flex-direction:column;}
.upper{flex:1;padding:52px 68px 32px;display:flex;flex-direction:column;overflow:hidden;}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;margin-bottom:36px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;}
.tag{background:#FBF7EE;border:1px solid #E8E0D0;color:#6D5C3A;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;padding:9px 24px;border-radius:20px;}
.mid{flex:1;display:flex;gap:44px;align-items:center;overflow:hidden;}
.txt{flex:1;overflow:hidden;}
.cat{color:#6D5C3A;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;}
.hl{font-family:'Outfit',sans-serif;color:#1C1C1E;font-size:80px;font-weight:800;line-height:1.07;letter-spacing:-.04em;margin-bottom:18px;}
.sub{color:#5A5248;font-family:'Outfit',sans-serif;font-size:36px;font-weight:400;line-height:1.5;}
.spk-card{width:240px;flex-shrink:0;background:#FFFFFF;border:1px solid #E8E0D0;border-radius:10px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.sp{width:160px;height:160px;border-radius:50%;overflow:hidden;border:2px solid #E8E0D0;}
.sp img{width:160px;height:160px;object-fit:cover;object-position:top center;}
.spkn{color:#1C1C1E;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;text-align:center;}
.spkr{color:#5A5248;font-family:'Outfit',sans-serif;font-size:18px;text-align:center;line-height:1.4;}
.lower{flex-shrink:0;height:190px;background:#1C1C1E;display:flex;align-items:center;justify-content:space-between;padding:0 68px;}
.meta{display:flex;flex-direction:column;gap:10px;}
.mr{color:rgba(255,255,255,0.75);font-size:26px;display:flex;align-items:center;gap:10px;}.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.6);}
.cta{background:#FFFFFF;color:#1C1C1E;font-family:'Outfit',sans-serif;font-size:24px;font-weight:800;padding:16px 52px;border-radius:50px;white-space:nowrap;}
</style></head><body>
<svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="hx" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse"><polygon points="30,2 58,17 58,47 30,62 2,47 2,17" fill="none" stroke="#6D5C3A" stroke-width="0.7" opacity="0.15"/></pattern></defs><rect width="1080" height="1080" fill="url(#hx)"/><circle cx="1040" cy="40" r="90" fill="none" stroke="#6D5C3A" stroke-width="1.2" opacity="0.18"/><circle cx="40" cy="1040" r="70" fill="none" stroke="#6D5C3A" stroke-width="1" opacity="0.15"/><line x1="0" y1="180" x2="280" y2="180" stroke="#6D5C3A" stroke-width="1.2" opacity="0.22"/><line x1="800" y1="900" x2="1080" y2="900" stroke="#6D5C3A" stroke-width="1.2" opacity="0.22"/></svg>
<div class="wrap">
  <div class="upper">
    <div class="hdr"><div class="logo"><img src="logo.png"></div><div class="tag">AI × CDP × 電商</div></div>
    <div class="mid">
      <div class="txt"><div class="cat">2025 座談會</div><div class="hl">限時免費入場！</div><div class="sub">掌握AI電商先機，錯過再等一年。</div></div>
      <div class="spk-card"><div class="sp"><img src="speaker4.jpg"></div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div>
    </div>
  </div>
  <div class="lower">
    <div class="meta"><div class="mr"><div class="dot"></div>2025.04.20（四） 14:00–15:20</div><div class="mr"><div class="dot"></div>台北 W 飯店 皇家宴會廳</div></div>
    <div class="cta">手刀報名 →</div>
  </div>
</div></body></html>
