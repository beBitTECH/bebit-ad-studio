<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#F9FAFB;font-family:'Noto Sans TC',sans-serif;}
.b1{position:absolute;width:600px;height:600px;background:radial-gradient(circle,#11182748,transparent 65%);top:-200px;right:-120px;}
.b2{position:absolute;width:400px;height:400px;background:radial-gradient(circle,#37415115,transparent 65%);bottom:-100px;left:-60px;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;padding:44px 56px;display:flex;flex-direction:column;gap:14px;z-index:5;}
.top{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;filter:brightness(0) invert(1);}
.badge{background:#374151;color:#F9FAFB;font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;padding:10px 26px;border-radius:22px;}
.card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:20px;padding:36px 44px;position:relative;flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;}
.card::before{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,#37415110,transparent 50%);pointer-events:none;}
.spp{position:absolute;top:28px;right:36px;width:200px;height:200px;border-radius:50%;overflow:hidden;border:3px solid #37415165;box-shadow:0 0 44px #37415128;}
.spp img{width:200px;height:200px;object-fit:cover;object-position:top center;}
.cat{color:#374151;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;}
.hl{font-family:'Bebas Neue',sans-serif;color:#111827;font-size:88px;line-height:.97;max-width:680px;margin-bottom:14px;}
.sub{color:#6B7280;font-family:'Outfit',sans-serif;font-size:36px;font-weight:400;line-height:1.5;max-width:680px;}
.chip{display:inline-flex;align-items:center;gap:12px;border:1px solid #E5E7EB;border-radius:28px;padding:10px 24px;margin-top:14px;}
.chipt{color:#6B7280;font-family:'Outfit',sans-serif;font-size:22px;}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;flex-shrink:0;height:96px;}
.gc{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;padding:14px 18px;}
.gl{color:#374151;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.gv{color:#111827;font-size:21px;font-weight:600;line-height:1.3;}
.ctac{background:#111827;border-radius:12px;height:68px;display:flex;align-items:center;justify-content:center;border:1px solid #37415150;flex-shrink:0;}
.ctact{color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;}
</style></head><body>
<div class="b1"></div><div class="b2"></div><svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="hx" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse"><polygon points="30,2 58,17 58,47 30,62 2,47 2,17" fill="none" stroke="#374151" stroke-width="0.7" opacity="0.15"/></pattern></defs><rect width="1080" height="1080" fill="url(#hx)"/><circle cx="1040" cy="40" r="90" fill="none" stroke="#374151" stroke-width="1.2" opacity="0.18"/><circle cx="40" cy="1040" r="70" fill="none" stroke="#374151" stroke-width="1" opacity="0.15"/><line x1="0" y1="180" x2="280" y2="180" stroke="#374151" stroke-width="1.2" opacity="0.22"/><line x1="800" y1="900" x2="1080" y2="900" stroke="#374151" stroke-width="1.2" opacity="0.22"/></svg>
<div class="wrap">
  <div class="top"><div class="logo"><img src="logo.png"></div><div class="badge">座談會 2025</div></div>
  <div class="card"><div class="spp"><img src="speaker4.jpg"></div>
    <div><div class="cat">AI × CDP × 電商</div><div class="hl">限時免費入場！</div><div class="sub">掌握AI電商先機，錯過再等一年。</div></div>
    <div class="chip"><span class="chipt">講者｜Olivia Hsiang · 業務副總監</span></div>
  </div>
  <div class="grid">
    <div class="gc"><div class="gl">日期</div><div class="gv">2025.04.20（四）</div></div>
    <div class="gc"><div class="gl">時間</div><div class="gv">14:00–15:20</div></div>
    <div class="gc"><div class="gl">地點</div><div class="gv">台北 W 飯店 皇家宴會廳</div></div>
  </div>
  <div class="ctac"><div class="ctact">手刀報名 →</div></div>
</div></body></html>
