<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#FAFAFA;font-family:'Noto Sans TC',sans-serif;}
.b1{position:absolute;width:600px;height:600px;background:radial-gradient(circle,#2D374848,transparent 65%);top:-200px;right:-120px;}
.b2{position:absolute;width:400px;height:400px;background:radial-gradient(circle,#4A556815,transparent 65%);bottom:-100px;left:-60px;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;padding:44px 56px;display:flex;flex-direction:column;gap:14px;z-index:5;}
.top{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;}

.card{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:20px;padding:36px 44px;position:relative;flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;}
.card::before{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,#4A556810,transparent 50%);pointer-events:none;}
.spp{position:absolute;top:28px;right:36px;width:200px;height:200px;border-radius:50%;overflow:hidden;border:3px solid #4A556865;box-shadow:0 0 44px #4A556828;}
.spp img{width:200px;height:200px;object-fit:cover;object-position:top center;}
.cat{color:#4A5568;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;}
.hl{font-family:'Bebas Neue',sans-serif;color:#1A202C;font-size:88px;line-height:.97;max-width:680px;margin-bottom:14px;}
.sub{color:#718096;font-family:'Outfit',sans-serif;font-size:36px;font-weight:400;line-height:1.5;max-width:680px;}
.chip{display:inline-flex;align-items:center;gap:12px;border:1px solid #E2E8F0;border-radius:28px;padding:10px 24px;margin-top:14px;}
.chipt{color:#718096;font-family:'Outfit',sans-serif;font-size:22px;}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;flex-shrink:0;height:96px;}
.gc{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;padding:14px 18px;}
.gl{color:#4A5568;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.gv{color:#1A202C;font-size:21px;font-weight:600;line-height:1.3;}
.ctac{background:#2D3748;border-radius:12px;height:68px;display:flex;align-items:center;justify-content:center;border:1px solid #4A556850;flex-shrink:0;}
.ctact{color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;}
</style></head><body>

</div></body></html>
