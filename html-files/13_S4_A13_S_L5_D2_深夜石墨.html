<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#0F1117;font-family:'Noto Sans TC',sans-serif;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;display:flex;flex-direction:column;}
.upper{flex:1;padding:52px 68px 32px;display:flex;flex-direction:column;overflow:hidden;}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;margin-bottom:36px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;}
.tag{background:#1F2130;border:1px solid rgba(156,163,175,0.2);color:#9CA3AF;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;padding:9px 24px;border-radius:20px;}
.mid{flex:1;display:flex;gap:44px;align-items:center;overflow:hidden;}
.txt{flex:1;overflow:hidden;}
.cat{color:#9CA3AF;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;}
.hl{font-family:'Outfit',sans-serif;color:#FFFFFF;font-size:80px;font-weight:800;line-height:1.07;letter-spacing:-.04em;margin-bottom:18px;}
.sub{color:#9CA3AF;font-family:'Outfit',sans-serif;font-size:36px;font-weight:400;line-height:1.5;}
.spk-card{width:240px;flex-shrink:0;background:#1C1D26;border:1px solid rgba(156,163,175,0.2);border-radius:10px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.sp{width:160px;height:160px;border-radius:50%;overflow:hidden;border:2px solid rgba(156,163,175,0.2);}
.sp img{width:160px;height:160px;object-fit:cover;object-position:top center;}
.spkn{color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;text-align:center;}
.spkr{color:#9CA3AF;font-family:'Outfit',sans-serif;font-size:18px;text-align:center;line-height:1.4;}
.lower{flex-shrink:0;height:190px;background:#374151;display:flex;align-items:center;justify-content:space-between;padding:0 68px;}
.meta{display:flex;flex-direction:column;gap:10px;}
.mr{color:rgba(255,255,255,0.75);font-size:26px;display:flex;align-items:center;gap:10px;}.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.6);}
.cta{background:#FFFFFF;color:#374151;font-family:'Outfit',sans-serif;font-size:24px;font-weight:800;padding:16px 52px;border-radius:50px;white-space:nowrap;}
</style></head><body>
<svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><polygon points="1080,0 1080,100 980,0" fill="#9CA3AF" opacity="0.2"/><polygon points="0,1080 100,1080 0,980" fill="#9CA3AF" opacity="0.2"/><polygon points="1080,250 1080,290 1040,290 1040,250" fill="#9CA3AF" opacity="0.25"/><polygon points="0,790 40,790 40,830 0,830" fill="#9CA3AF" opacity="0.25"/><path d="M860,40 L910,0 L960,40 L910,80 Z" fill="#374151" opacity="0.2"/><path d="M120,1000 L170,960 L220,1000 L170,1040 Z" fill="#374151" opacity="0.18"/><line x1="940" y1="120" x2="1080" y2="120" stroke="#9CA3AF" stroke-width="2" opacity="0.25"/><line x1="0" y1="960" x2="140" y2="960" stroke="#9CA3AF" stroke-width="2" opacity="0.25"/></svg>
<div class="wrap">
  <div class="upper">
    <div class="hdr"><div class="logo"><img src="darklogo.png"></div><div class="tag">AI × CDP × 電商</div></div>

    </div>
  </div>
  <div class="lower">
    <div class="meta"><div class="mr"><div class="dot"></div>2025.04.20（四） 14:00–15:20</div><div class="mr"><div class="dot"></div>台北 W 飯店 皇家宴會廳</div></div>
