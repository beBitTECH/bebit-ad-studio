<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#F8FAFF;font-family:'Noto Sans TC',sans-serif;}
.b1{position:absolute;width:600px;height:600px;background:radial-gradient(circle,#1E40AF48,transparent 65%);top:-200px;right:-120px;}
.b2{position:absolute;width:400px;height:400px;background:radial-gradient(circle,#3B82F615,transparent 65%);bottom:-100px;left:-60px;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;padding:44px 56px;display:flex;flex-direction:column;gap:14px;z-index:5;}
.top{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;filter:brightness(0) invert(1);}
.badge{background:#3B82F6;color:#F8FAFF;font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;padding:10px 26px;border-radius:22px;}
.card{background:#FFFFFF;border:1px solid #DBEAFE;border-radius:20px;padding:36px 44px;position:relative;flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;}
.card::before{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,#3B82F610,transparent 50%);pointer-events:none;}
.spp{position:absolute;top:28px;right:36px;width:200px;height:200px;border-radius:50%;overflow:hidden;border:3px solid #3B82F665;box-shadow:0 0 44px #3B82F628;}
.spp img{width:200px;height:200px;object-fit:cover;object-position:top center;}
.cat{color:#3B82F6;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;}
.hl{font-family:'Bebas Neue',sans-serif;color:#1E293B;font-size:88px;line-height:.97;max-width:680px;margin-bottom:14px;}
.sub{color:#475569;font-family:'Outfit',sans-serif;font-size:36px;font-weight:400;line-height:1.5;max-width:680px;}
.chip{display:inline-flex;align-items:center;gap:12px;border:1px solid #DBEAFE;border-radius:28px;padding:10px 24px;margin-top:14px;}
.chipt{color:#475569;font-family:'Outfit',sans-serif;font-size:22px;}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;flex-shrink:0;height:96px;}
.gc{background:#FFFFFF;border:1px solid #DBEAFE;border-radius:10px;padding:14px 18px;}
.gl{color:#3B82F6;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.gv{color:#1E293B;font-size:21px;font-weight:600;line-height:1.3;}
.ctac{background:#1E40AF;border-radius:12px;height:68px;display:flex;align-items:center;justify-content:center;border:1px solid #3B82F650;flex-shrink:0;}
.ctact{color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;}
</style></head><body>
<div class="b1"></div><div class="b2"></div><svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="0" x2="1080" y2="1080" stroke="#3B82F6" stroke-width="1" opacity="0.07"/><line x1="180" y1="0" x2="1080" y2="900" stroke="#3B82F6" stroke-width="0.8" opacity="0.05"/><line x1="0" y1="180" x2="900" y2="1080" stroke="#3B82F6" stroke-width="0.8" opacity="0.05"/><circle cx="540" cy="540" r="420" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.08"/><circle cx="540" cy="540" r="280" fill="none" stroke="#3B82F6" stroke-width="0.6" opacity="0.06"/><rect x="18" y="18" width="84" height="84" fill="none" stroke="#3B82F6" stroke-width="2.2" opacity="0.32"/><rect x="978" y="978" width="84" height="84" fill="none" stroke="#3B82F6" stroke-width="2.2" opacity="0.32"/></svg>
<div class="wrap">
  <div class="top"><div class="logo"><img src="logo.png"></div><div class="badge">座談會 2025</div></div>
  <div class="card"><div class="spp"><img src="speaker4.jpg"></div>
    <div><div class="cat">AI × CDP × 電商</div><div class="hl">席次有限，速搶！</div><div class="sub">AI CDP 3.0發表會，電商精英齊聚。</div></div>
    <div class="chip"><span class="chipt">講者｜Olivia Hsiang · 業務副總監</span></div>
  </div>
  <div class="grid">
    <div class="gc"><div class="gl">日期</div><div class="gv">2025.04.20（四）</div></div>
    <div class="gc"><div class="gl">時間</div><div class="gv">14:00–15:20</div></div>
    <div class="gc"><div class="gl">地點</div><div class="gv">台北 W 飯店 皇家宴會廳</div></div>
  </div>
  <div class="ctac"><div class="ctact">立即搶位 →</div></div>
</div></body></html>
