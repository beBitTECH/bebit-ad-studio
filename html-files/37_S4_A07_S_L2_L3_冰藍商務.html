<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#F0F4F8;font-family:'Noto Sans TC',sans-serif;}
.stripe{position:absolute;top:0;left:0;width:10px;height:1080px;background:#1A365D;}
.wrap{position:absolute;top:0;left:10px;width:1070px;height:1080px;padding:52px 68px;display:flex;flex-direction:column;}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;margin-bottom:40px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;}
.tag{border:1.5px solid #2B6CB0;color:#2B6CB0;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;padding:9px 24px;border-radius:4px;letter-spacing:.1em;text-transform:uppercase;}
.hero{flex:1;display:flex;gap:44px;overflow:hidden;}
.txt{flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.cat{color:#2B6CB0;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;}
.hl{font-family:'Outfit',sans-serif;color:#1A202C;font-size:80px;font-weight:800;line-height:1.07;letter-spacing:-.04em;margin-bottom:18px;}
.sub{color:#4A5568;font-family:'Outfit',sans-serif;font-size:36px;font-weight:400;line-height:1.55;}
.spk-col{width:260px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.spp{width:260px;height:320px;border-radius:8px;overflow:hidden;border:1px solid #CBD5E0;}
.spp img{width:260px;height:320px;object-fit:cover;object-position:top center;}
.spkn{color:#1A202C;font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;text-align:center;}
.spkr{color:#4A5568;font-family:'Outfit',sans-serif;font-size:20px;text-align:center;line-height:1.4;}
.foot{flex-shrink:0;height:140px;border-top:1px solid #CBD5E0;display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:24px;}
.fc{display:flex;flex-direction:column;justify-content:center;padding:0 0 0 0;}
.fc:not(:first-child){border-left:1px solid #CBD5E0;padding-left:28px;}
.fl{color:#2B6CB0;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;}
.fv{color:#1A202C;font-family:'Outfit',sans-serif;font-size:22px;font-weight:600;line-height:1.35;}
.cta{background:#1A365D;color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;padding:14px 0;border-radius:6px;text-align:center;}
</style></head><body>
<svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dt" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="1.2" fill="#2B6CB0" opacity="0.18"/></pattern></defs><rect width="1080" height="1080" fill="url(#dt)"/><path d="M0,90 H180 V270 H380 V180 H560" stroke="#2B6CB0" stroke-width="1.4" fill="none" opacity="0.2"/><path d="M1080,810 H900 V630 H700 V720 H500 V920" stroke="#2B6CB0" stroke-width="1.4" fill="none" opacity="0.2"/><circle cx="180" cy="90" r="5" fill="#2B6CB0" opacity="0.35"/><circle cx="380" cy="270" r="5" fill="#2B6CB0" opacity="0.35"/><circle cx="900" cy="810" r="5" fill="#2B6CB0" opacity="0.35"/><circle cx="700" cy="630" r="5" fill="#2B6CB0" opacity="0.35"/></svg><div class="stripe"></div>
<div class="wrap">
  <div class="hdr"><div class="logo"><img src="logo.png"></div><div class="tag">2025 Seminar</div></div>
  <div class="hero">
    <div class="txt"><div class="cat">AI × CDP × 電商</div><div class="hl">未來CDP長怎樣？</div><div class="sub">AI native革命，超乎想像的電商工具。</div></div>
    <div class="spk-col"><div class="spp"><img src="speaker4.jpg"></div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div>
  </div>
  <div class="foot">
    <div class="fc"><div class="fl">日期</div><div class="fv">2025.04.20（四）</div></div>
    <div class="fc"><div class="fl">時間 & 地點</div><div class="fv">14:00–15:20<br>台北 W 飯店 皇家宴會廳</div></div>
    <div class="fc"><div class="fl">立即行動</div><div class="cta" style="margin-top:8px">搶先揭曉 →</div></div>
  </div>
</div></body></html>
