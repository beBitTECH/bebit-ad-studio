<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#FAFAFA;font-family:'Noto Sans TC',sans-serif;}
.g1{position:absolute;width:760px;height:760px;background:radial-gradient(circle,#2D374850,transparent 65%);top:-240px;right:-160px;}
.g2{position:absolute;width:440px;height:440px;background:radial-gradient(circle,#4A556814,transparent 65%);bottom:-80px;left:-60px;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;display:flex;flex-direction:column;z-index:5;}
.top{display:flex;justify-content:space-between;align-items:center;padding:50px 68px 0;flex-shrink:0;height:180px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;filter:brightness(0) invert(1);}
.tag{background:#EDF2F7;border:1px solid #E2E8F0;color:#4A5568;font-family:'Syne',sans-serif;font-size:21px;font-weight:700;padding:10px 28px;border-radius:40px;}
.body{flex:1;padding:28px 68px 0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.eye{color:#4A5568;font-family:'Syne',sans-serif;font-size:21px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.eye::before{content:'';width:44px;height:3px;background:#4A5568;}
.hl{font-family:'Syne',sans-serif;color:#1A202C;font-size:92px;font-weight:800;line-height:1.06;letter-spacing:-.04em;margin-bottom:16px;}
.sub{color:#718096;font-size:38px;line-height:1.5;}
.bar{flex-shrink:0;height:230px;background:#FFFFFF;border-top:2px solid #4A556840;padding:0 68px;display:flex;align-items:center;justify-content:space-between;}
.spk{display:flex;align-items:center;gap:22px;}
.sp{width:200px;height:200px;border-radius:50%;overflow:hidden;border:3px solid #4A556865;flex-shrink:0;}
.sp img{width:200px;height:200px;object-fit:cover;object-position:top center;}
.spkn{color:#1A202C;font-family:'Syne',sans-serif;font-size:38px;font-weight:700;}
.spkr{color:#718096;font-size:28px;margin-top:5px;}
.rb{display:flex;flex-direction:column;align-items:flex-end;gap:12px;}
.mr{color:#718096;font-size:26px;}
.cta{background:#2D3748;color:#FFFFFF;font-family:'Syne',sans-serif;font-size:26px;font-weight:700;padding:14px 48px;border-radius:50px;border:1px solid #4A556860;}
</style></head><body>
