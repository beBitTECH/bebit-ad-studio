<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}

body{background:#F8FAFF;font-family:'Noto Sans TC',sans-serif;padding:32px;}
.frame{position:absolute;top:32px;left:32px;width:1016px;height:1016px;border:2px solid #1E40AF;border-radius:4px;overflow:hidden;}

.hl{font-family:'Outfit',sans-serif;color:#1E293B;font-size:74px;font-weight:800;line-height:1.08;letter-spacing:-.04em;margin-bottom:18px;}
.sub{color:#475569;font-family:'Outfit',sans-serif;font-size:34px;font-weight:400;line-height:1.55;}
.meta{display:flex;flex-direction:column;gap:9px;}
.ml{color:#475569;font-size:23px;}.em{color:#1E293B;font-weight:600;}

.sp{width:180px;height:180px;border-radius:50%;overflow:hidden;border:2px solid #DBEAFE;}
.sp img{width:180px;height:180px;object-fit:cover;object-position:top center;}
.spkn{color:#1E293B;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;text-align:center;}
.spkr{color:#475569;font-family:'Outfit',sans-serif;font-size:18px;text-align:center;line-height:1.4;}
.foot{flex-shrink:0;display:flex;justify-content:flex-end;margin-top:24px;}
.cta{background:#1E40AF;color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;padding:14px 52px;border-radius:4px;}
