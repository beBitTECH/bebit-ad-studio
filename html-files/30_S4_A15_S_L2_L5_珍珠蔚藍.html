<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#F8FAFF;font-family:'Noto Sans TC',sans-serif;}
.stripe{position:absolute;top:0;left:0;width:10px;height:1080px;background:#1E40AF;}
.wrap{position:absolute;top:0;left:10px;width:1070px;height:1080px;padding:52px 68px;display:flex;flex-direction:column;}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;margin-bottom:40px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;}
.tag{border:1.5px solid #3B82F6;color:#3B82F6;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;padding:9px 24px;border-radius:4px;letter-spacing:.1em;text-transform:uppercase;}
.hero{flex:1;display:flex;gap:44px;overflow:hidden;}
.txt{flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.cat{color:#3B82F6;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;}
.hl{font-family:'Outfit',sans-serif;color:#1E293B;font-size:80px;font-weight:800;line-height:1.07;letter-spacing:-.04em;margin-bottom:18px;}
.sub{color:#475569;font-family:'Outfit',sans-serif;font-size:36px;font-weight:400;line-height:1.55;}
.spk-col{width:260px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.spp{width:260px;height:320px;border-radius:8px;overflow:hidden;border:1px solid #DBEAFE;}
.spp img{width:260px;height:320px;object-fit:cover;object-position:top center;}
.spkn{color:#1E293B;font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;text-align:center;}
.spkr{color:#475569;font-family:'Outfit',sans-serif;font-size:20px;text-align:center;line-height:1.4;}
.foot{flex-shrink:0;height:140px;border-top:1px solid #DBEAFE;display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:24px;}
.fc{display:flex;flex-direction:column;justify-content:center;padding:0 0 0 0;}
.fc:not(:first-child){border-left:1px solid #DBEAFE;padding-left:28px;}
.fl{color:#3B82F6;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;}
.fv{color:#1E293B;font-family:'Outfit',sans-serif;font-size:22px;font-weight:600;line-height:1.35;}
.cta{background:#1E40AF;color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;padding:14px 0;border-radius:6px;text-align:center;}
</style></head><body>
<svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="0" x2="1080" y2="1080" stroke="#3B82F6" stroke-width="1" opacity="0.07"/><line x1="180" y1="0" x2="1080" y2="900" stroke="#3B82F6" stroke-width="0.8" opacity="0.05"/><line x1="0" y1="180" x2="900" y2="1080" stroke="#3B82F6" stroke-width="0.8" opacity="0.05"/><circle cx="540" cy="540" r="420" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.08"/><circle cx="540" cy="540" r="280" fill="none" stroke="#3B82F6" stroke-width="0.6" opacity="0.06"/><rect x="18" y="18" width="84" height="84" fill="none" stroke="#3B82F6" stroke-width="2.2" opacity="0.32"/><rect x="978" y="978" width="84" height="84" fill="none" stroke="#3B82F6" stroke-width="2.2" opacity="0.32"/></svg><div class="stripe"></div>
<div class="wrap">
  <div class="hdr"><div class="logo"><img src="logo.png"></div><div class="tag">2025 Seminar</div></div>
  <div class="hero">
    <div class="txt"><div class="cat">AI × CDP × 電商</div><div class="hl">業界專家齊聚</div><div class="sub">AI CDP 3.0發表，見證劃時代變革。</div></div>
    <div class="spk-col"><div class="spp"><img src="speaker4.jpg"></div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div>
  </div>
  <div class="foot">
    <div class="fc"><div class="fl">日期</div><div class="fv">2025.04.20（四）</div></div>
    <div class="fc"><div class="fl">時間 & 地點</div><div class="fv">14:00–15:20<br>台北 W 飯店 皇家宴會廳</div></div>
    <div class="fc"><div class="fl">立即行動</div><div class="cta" style="margin-top:8px">立即報名 →</div></div>
  </div>
</div></body></html>
