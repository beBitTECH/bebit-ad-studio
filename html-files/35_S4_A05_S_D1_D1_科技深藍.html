<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}

body{background:#06111F;font-family:'Noto Sans TC',sans-serif;}

.eye{color:#38BDF8;font-family:'Syne',sans-serif;font-size:21px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.eye::before{content:'';width:44px;height:3px;background:#38BDF8;}
.hl{font-family:'Syne',sans-serif;color:#FFFFFF;font-size:92px;font-weight:800;line-height:1.06;letter-spacing:-.04em;margin-bottom:16px;}
.sub{color:#93C5FD;font-size:38px;line-height:1.5;}
.bar{flex-shrink:0;height:230px;background:#0C1E35;border-top:2px solid #38BDF840;padding:0 68px;display:flex;align-items:center;justify-content:space-between;}
.spk{display:flex;align-items:center;gap:22px;}
.sp{width:200px;height:200px;border-radius:50%;overflow:hidden;border:3px solid #38BDF865;flex-shrink:0;}
.sp img{width:200px;height:200px;object-fit:cover;object-position:top center;}
.spkn{color:#FFFFFF;font-family:'Syne',sans-serif;font-size:38px;font-weight:700;}
.spkr{color:#93C5FD;font-size:28px;margin-top:5px;}
.rb{display:flex;flex-direction:column;align-items:flex-end;gap:12px;}
.mr{color:#93C5FD;font-size:26px;}
.cta{background:#1D4ED8;color:#FFFFFF;font-family:'Syne',sans-serif;font-size:26px;font-weight:700;padding:14px 48px;border-radius:50px;border:1px solid #38BDF860;}
