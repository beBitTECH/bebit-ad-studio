<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#FFFFFF;font-family:'Noto Sans TC',sans-serif;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;padding:52px 56px;display:flex;flex-direction:column;}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;margin-bottom:32px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;}
.badge{background:#EBF2FF;border:1px solid #E2E8F0;color:#0055CC;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;padding:9px 24px;border-radius:20px;}
.cols{display:grid;grid-template-columns:1fr 1px 220px 1px 1fr;flex:1;overflow:hidden;}
.sep{background:#E2E8F0;}
.col{padding:0 36px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}
.col:first-child{padding-left:0;}
.col:last-child{padding-right:0;}
.cl{color:#0055CC;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;}
.hl{font-family:'Outfit',sans-serif;color:#0A0A0A;font-size:66px;font-weight:800;line-height:1.09;letter-spacing:-.035em;}
.sub{color:#4A5568;font-size:30px;line-height:1.55;margin-top:16px;}
.mid-col{padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.sp{width:180px;height:180px;border-radius:50%;overflow:hidden;border:2px solid #E2E8F0;}
.sp img{width:180px;height:180px;object-fit:cover;object-position:top center;}
.spkn{color:#0A0A0A;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;text-align:center;}
.spkr{color:#4A5568;font-size:18px;text-align:center;line-height:1.4;}
.info-list{display:flex;flex-direction:column;gap:14px;}
.ii{border-left:3px solid #0055CC;padding-left:14px;}
.il{color:#0055CC;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.iv{color:#0A0A0A;font-size:22px;font-weight:600;line-height:1.35;}
.cta{background:#003366;color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;padding:14px 0;border-radius:6px;text-align:center;}
</style></head><body>
<svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><path d="M0,820 Q200,740 400,780 T800,720 T1080,760" stroke="#0055CC" stroke-width="2" fill="none" opacity="0.22"/><path d="M0,860 Q200,780 400,820 T800,760 T1080,800" stroke="#0055CC" stroke-width="1.2" fill="none" opacity="0.14"/><path d="M0,300 Q250,220 500,270 T900,220 T1080,250" stroke="#0055CC" stroke-width="1.5" fill="none" opacity="0.18"/><circle cx="200" cy="754" r="5" fill="#0055CC" opacity="0.55"/><circle cx="540" cy="718" r="5" fill="#0055CC" opacity="0.55"/><circle cx="880" cy="736" r="5" fill="#0055CC" opacity="0.55"/><circle cx="300" cy="248" r="4" fill="#0055CC" opacity="0.45"/><circle cx="750" cy="228" r="4" fill="#0055CC" opacity="0.45"/></svg>
<div class="wrap">
  <div class="hdr"><div class="logo"><img src="logo.png"></div><div class="badge">AI × CDP × 電商</div></div>
  <div class="cols">
    <div class="col">
      <div><div class="cl">本次主題</div><div class="hl">提升電商營收！</div><div class="sub">AI CDP 3.0，賦能行銷新紀元。</div></div>
    </div>
    <div class="sep"></div>
    <div class="col">
      <div class="cl" style="text-align:center">主講者</div>
      <div class="mid-col"><div class="sp"><img src="speaker4.jpg"></div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div>
      <div></div>
    </div>
    <div class="sep"></div>
    <div class="col">
      <div>
        <div class="cl">活動資訊</div>
        <div class="info-list">
          <div class="ii"><div class="il">日期</div><div class="iv">2025.04.20（四）</div></div>
          <div class="ii"><div class="il">時間</div><div class="iv">14:00–15:20</div></div>
          <div class="ii"><div class="il">地點</div><div class="iv">台北 W 飯店 皇家宴會廳</div></div>
        </div>
      </div>
      <div class="cta">立即報名 →</div>
    </div>
  </div>
</div></body></html>
