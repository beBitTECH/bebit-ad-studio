<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#F0F4F8;font-family:'Noto Sans TC',sans-serif;padding:32px;}
.frame{position:absolute;top:32px;left:32px;width:1016px;height:1016px;border:2px solid #1A365D;border-radius:4px;overflow:hidden;}
.inner{position:absolute;top:0;left:0;width:1016px;height:1016px;padding:44px 52px;display:flex;flex-direction:column;}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;margin-bottom:32px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;}
.tag{border:1px solid #2B6CB0;color:#2B6CB0;font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;padding:8px 22px;border-radius:4px;letter-spacing:.1em;text-transform:uppercase;}
.content{flex:1;display:flex;gap:44px;overflow:hidden;}
.txt{flex:1;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}
.cat{color:#2B6CB0;font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;}
.hl{font-family:'Outfit',sans-serif;color:#1A202C;font-size:74px;font-weight:800;line-height:1.08;letter-spacing:-.04em;margin-bottom:18px;}
.sub{color:#4A5568;font-family:'Outfit',sans-serif;font-size:34px;font-weight:400;line-height:1.55;}
.meta{display:flex;flex-direction:column;gap:9px;}
.ml{color:#4A5568;font-size:23px;}.em{color:#1A202C;font-weight:600;}
.spk-panel{width:240px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:14px;justify-content:center;border-left:1px solid #CBD5E0;padding-left:32px;}
.sp{width:180px;height:180px;border-radius:50%;overflow:hidden;border:2px solid #CBD5E0;}
.sp img{width:180px;height:180px;object-fit:cover;object-position:top center;}
.spkn{color:#1A202C;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;text-align:center;}
.spkr{color:#4A5568;font-family:'Outfit',sans-serif;font-size:18px;text-align:center;line-height:1.4;}
.foot{flex-shrink:0;display:flex;justify-content:flex-end;margin-top:24px;}
.cta{background:#1A365D;color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;padding:14px 52px;border-radius:4px;}
</style></head><body>
<svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dt" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="1.2" fill="#2B6CB0" opacity="0.18"/></pattern></defs><rect width="1080" height="1080" fill="url(#dt)"/><path d="M0,90 H180 V270 H380 V180 H560" stroke="#2B6CB0" stroke-width="1.4" fill="none" opacity="0.2"/><path d="M1080,810 H900 V630 H700 V720 H500 V920" stroke="#2B6CB0" stroke-width="1.4" fill="none" opacity="0.2"/><circle cx="180" cy="90" r="5" fill="#2B6CB0" opacity="0.35"/><circle cx="380" cy="270" r="5" fill="#2B6CB0" opacity="0.35"/><circle cx="900" cy="810" r="5" fill="#2B6CB0" opacity="0.35"/><circle cx="700" cy="630" r="5" fill="#2B6CB0" opacity="0.35"/></svg>
<div class="frame">
  <div class="inner">
    <div class="hdr"><div class="logo"><img src="logo.png"></div><div class="tag">AI × CDP × 電商</div></div>
    <div class="content">
      <div class="txt">
        <div><div class="cat">2025 座談會</div><div class="hl">倒數計時，速報！</div><div class="sub">AI CDP 3.0，改變電商格局。</div></div>
        <div class="meta"><div class="ml"><span class="em">2025.04.20（四） 14:00–15:20</span></div><div class="ml">台北 W 飯店 皇家宴會廳</div></div>
      </div>
      <div class="spk-panel"><div class="sp"><img src="speaker4.jpg"></div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div>
    </div>
    <div class="foot"><div class="cta">立即報名 →</div></div>
  </div>
</div></body></html>
