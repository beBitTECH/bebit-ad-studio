<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{display:block;width:1080px;height:1080px;overflow:hidden;}
body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;position:relative;display:block;}

body{background:#F0F4F8;font-family:'Noto Sans TC',sans-serif;}
.wrap{position:absolute;top:0;left:0;width:1080px;height:1080px;padding:52px 56px;display:flex;flex-direction:column;}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;height:130px;margin-bottom:32px;}
.logo img{height:130px;width:auto;object-fit:contain;max-width:300px;}
.badge{background:#EBF8FF;border:1px solid #CBD5E0;color:#2B6CB0;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;padding:9px 24px;border-radius:20px;}
.cols{display:grid;grid-template-columns:1fr 1px 220px 1px 1fr;flex:1;overflow:hidden;}
.sep{background:#CBD5E0;}
.col{padding:0 36px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}
.col:first-child{padding-left:0;}
.col:last-child{padding-right:0;}
.cl{color:#2B6CB0;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;}
.hl{font-family:'Outfit',sans-serif;color:#1A202C;font-size:66px;font-weight:800;line-height:1.09;letter-spacing:-.035em;}
.sub{color:#4A5568;font-size:30px;line-height:1.55;margin-top:16px;}
.mid-col{padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.sp{width:180px;height:180px;border-radius:50%;overflow:hidden;border:2px solid #CBD5E0;}
.sp img{width:180px;height:180px;object-fit:cover;object-position:top center;}
.spkn{color:#1A202C;font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;text-align:center;}
.spkr{color:#4A5568;font-size:18px;text-align:center;line-height:1.4;}
.info-list{display:flex;flex-direction:column;gap:14px;}
.ii{border-left:3px solid #2B6CB0;padding-left:14px;}
.il{color:#2B6CB0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.iv{color:#1A202C;font-size:22px;font-weight:600;line-height:1.35;}
.cta{background:#1A365D;color:#FFFFFF;font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;padding:14px 0;border-radius:6px;text-align:center;}
</style></head><body>
<svg style="position:absolute;inset:0;width:1080px;height:1080px;pointer-events:none;z-index:1" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><polygon points="1080,0 1080,100 980,0" fill="#2B6CB0" opacity="0.2"/><polygon points="0,1080 100,1080 0,980" fill="#2B6CB0" opacity="0.2"/><polygon points="1080,250 1080,290 1040,290 1040,250" fill="#2B6CB0" opacity="0.25"/><polygon points="0,790 40,790 40,830 0,830" fill="#2B6CB0" opacity="0.25"/><path d="M860,40 L910,0 L960,40 L910,80 Z" fill="#1A365D" opacity="0.2"/><path d="M120,1000 L170,960 L220,1000 L170,1040 Z" fill="#1A365D" opacity="0.18"/><line x1="940" y1="120" x2="1080" y2="120" stroke="#2B6CB0" stroke-width="2" opacity="0.25"/><line x1="0" y1="960" x2="140" y2="960" stroke="#2B6CB0" stroke-width="2" opacity="0.25"/></svg>
<div class="wrap">
  <div class="hdr"><div class="logo"><img src="logo.png"></div><div class="badge">AI × CDP × 電商</div></div>
  <div class="cols">
    <div class="col">
      <div><div class="cl">本次主題</div><div class="hl">轉化率上不去？</div><div class="sub">AI動態優化，精準捕捉顧客意圖。</div></div>
    </div>
    <div class="sep"></div>
    <div class="col">
      <div class="cl" style="text-align:center">主講者</div>
      <div class="mid-col"><div class="sp"><img src="speaker4.jpg"></div><div class="spkn">Olivia Hsiang</div><div class="spkr">業務副總監</div></div>
      <div></div>
    </div>
    <div class="sep"></div>
    <div class="col">
      <div>
        <div class="cl">活動資訊</div>
        <div class="info-list">
          <div class="ii"><div class="il">日期</div><div class="iv">2025.04.20（四）</div></div>
          <div class="ii"><div class="il">時間</div><div class="iv">14:00–15:20</div></div>
          <div class="ii"><div class="il">地點</div><div class="iv">台北 W 飯店 皇家宴會廳</div></div>
        </div>
      </div>
      <div class="cta">免費報名 →</div>
    </div>
  </div>
</div></body></html>
